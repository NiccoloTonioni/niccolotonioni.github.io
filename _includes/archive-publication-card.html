{% include base_path %}

<div class="pub-card" id="{{ post.url | replace: '/', '-' | remove_first: '-' }}">
  <h3 class="pub-title">
    <a href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
  </h3>
  {% if post.authors %}
    <p class="pub-authors">{{ post.authors }}</p>
  {% endif %}
  <div class="pub-meta">
    <span class="pub-venue">{{ post.venue }}</span>
    <span class="pub-year">{{ post.date | date: "%Y" }}</span>
  </div>
  {% if post.excerpt %}
    <p class="pub-excerpt">{{ post.excerpt }}</p>
  {% endif %}
  <div class="pub-links">
    {% if post.paperurl %}<a href="{{ post.paperurl }}" class="pub-link" target="_blank">Paper</a>{% endif %}
    {% if post.slidesurl %}<a href="{{ post.slidesurl }}" class="pub-link" target="_blank">Slides</a>{% endif %}
  </div>
</div>
