  title: "VIVALDy Paper: Extended version of the framework presented at AiFluids, Chania"
  snippet: >
    Our latest work published in Physical Review Fluids extends the framework initially presented at AiFluids 2025
    with deeper analysis of the learned latent space dynamics. VIVALDy combines
    a β-VAE-GAN architecture with transformers to reconstruct vortex-induced
    vibrations from cylinder displacement alone, revealing physically meaningful
    flow structures through latent space topology.
