- date: "2025-07-01"
  title: "Presented at THMT-25 – Tokyo"
  snippet: >
    An extension of the work presented at EUROMECH 629 was presented at the 11th International
    Symposium on Turbulence Heat and Mass Transfer (THMT-25) in Tokyo, Japan. A deeper analysis
    of latent space forecasting was carried out, showing the framework accurately predicts
    latent space dynamics and preserves chaotic characteristics within one Lyapunov time.
  link: "/talks/2025-07-thmt25"
