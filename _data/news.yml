- date: "2026-07-01"
  title: "France–Stanford Center Visiting Student Researcher Fellowship 🏆"
  snippet: >
    "You can't connect the dots looking forward; you can only connect them looking backwards." 
    Visiting Stanford has been a goal since day one of my PhD, and it is exciting to see those dots 
    align. Honored to receive the France–Stanford Center Visiting Student Researcher Fellowship to join 
    Prof. Beverley J. McKeon's group (Oct.–Nov. 2026). We will focus on explainable AI (SHAP) to quantify 
    coherent structures in unsteady turbulent boundary layers. Stay hungry, stay foolish.
  link: "https://francestanford.stanford.edu/projects/quantifying-structure-evolution-unsteady-turbulent-boundary-layers"
