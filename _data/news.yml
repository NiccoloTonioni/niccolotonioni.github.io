- date: "2025-09-25"
  title: "VIVALDy preprint on arXiv"
  snippet: >
    The VIVALDy preprint is now available on arXiv. The framework combines a β-VAE-GAN with masked
    convolutions and a bidirectional transformer to reconstruct turbulent flow around a moving cylinder
    using only cylinder displacement as input.
  arxiv: "https://arxiv.org/abs/2509.24965"
  webpage: "https://niccolotonioni.github.io/vivaldy"
